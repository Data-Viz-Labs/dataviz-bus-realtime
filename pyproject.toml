[project]
name = "bus-sim"
version = "2.0.0a0"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
aws = ["boto3>=1.40"]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.16.10"]

[tool.setuptools]
packages = ["sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
