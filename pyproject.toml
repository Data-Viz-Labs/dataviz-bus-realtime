[project]
name = "bus-sim"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
aws = ["boto3>=1.43.113"]
history = ["pyarrow>=17", "numpy>=2"]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "pyarrow>=17", "numpy>=2"]

[tool.setuptools.packages.find]
where = ["src/container"]
include = ["sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
