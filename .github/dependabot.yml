version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/src/container"
    schedule:
      interval: "weekly"
  - package-ecosystem: "terraform"
    directories: ["/iac/stack", "/iac/bootstrap", "/iac/modules/cost-management"]
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
