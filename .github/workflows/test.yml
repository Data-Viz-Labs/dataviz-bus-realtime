name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[aws,dev]"
      - run: ruff check src bin tests examples
      - run: python bin/export_mcp_docs.py --check
      - run: pytest
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
      - run: python bin/export_web.py
      - run: terraform -chdir=iac/stack fmt -check -recursive
      - run: terraform -chdir=iac/stack init -backend=false && terraform -chdir=iac/stack validate
